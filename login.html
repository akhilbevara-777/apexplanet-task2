<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | ApexPlanet</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-8n8mljMxnsdNRcJ/NeDk9iOM0NJL8x9wV8rcc+K9P9r+koaTML5+pUoRhW11BxqC" crossorigin="anonymous" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login" class="bg-dark text-light">
  <div id="siteNav"></div>

  <main class="login-page min-vh-100 d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-xl-4 col-lg-5 col-md-7">
          <div class="glass-panel auth-panel p-4 p-md-5 rounded-4 shadow-sm">
            <div class="text-center mb-4">
              <div class="avatar shadow-sm mb-3 d-inline-flex align-items-center justify-content-center rounded-circle" style="width:72px; height:72px; background:rgba(255,255,255,0.06);">
                <i class="bi bi-person-lock fs-3"></i>
              </div>
              <h1 class="h4 mb-2">Welcome Back</h1>
              <p class="text-muted mb-0">Sign in to continue to ApexPlanet.</p>
            </div>

            <form id="loginForm" class="mt-4" novalidate>
              <div class="mb-3 position-relative">
                <label for="loginEmail" class="form-label">Email</label>
                <input type="email" class="form-control form-control-dark" id="loginEmail" placeholder="name@example.com" required maxlength="80" />
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>

              <div class="mb-3 position-relative">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control form-control-dark password-field" id="loginPassword" placeholder="••••••••" required minlength="6" maxlength="32" />
                <button type="button" class="btn btn-sm btn-link text-decoration-none password-toggle" aria-label="Toggle password visibility">
                  <i class="bi bi-eye-fill"></i>
                </button>
                <div class="invalid-feedback">Password must be at least 6 characters.</div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe" />
                  <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="text-primary small text-decoration-none">Forgot password?</a>
              </div>

              <div class="d-grid mb-3">
                <button id="loginSubmit" type="submit" class="btn btn-primary btn-lg fw-semibold">Sign In</button>
              </div>

              <div id="loginStatus" class="small text-muted"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="siteFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoK18m1NQ5+31N6c3q3up0K8Y5QnN3G5p+E5oz9BS+ZgTnh" crossorigin="anonymous" defer></script>
  <script src="js/components.js" defer></script>
</body>
</html>
