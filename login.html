<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | ApexPlanet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-8n8mljMxnsdNRcJ/NeDk9iOM0NJL8x9wV8rcc+K9P9r+koaTML5+pUoRhW11BxqC" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-p1PcV1CUO/pW0VDYDbL1S4jJ5naC4DXcWuzSQm2nXrX5lWJ+WcRNoA8Mh9UYV1HZ0c8vGjFjB2pzYOkTBGX60A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="login-page min-vh-100 d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-xl-4 col-lg-5 col-md-7">
          <div class="login-card p-4 p-md-5 rounded-4 shadow-xl">
            <div class="text-center mb-4">
              <div class="avatar shadow-sm mb-3">
                <i class="fa-solid fa-user-gear fa-2x"></i>
              </div>
              <h1 class="h4 mb-2">Welcome Back</h1>
              <p class="text-muted mb-0">Sign in to continue to ApexPlanet.</p>
            </div>

            <form id="loginForm" novalidate>
              <div class="mb-3 form-floating">
                <input type="email" class="form-control form-control-dark" id="loginEmail" placeholder="Email" required maxlength="80" />
                <label for="loginEmail"><i class="fa-solid fa-envelope me-2"></i>Email</label>
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>

              <div class="mb-3 form-floating position-relative">
                <input type="password" class="form-control form-control-dark" id="loginPassword" placeholder="Password" required minlength="8" maxlength="32" />
                <label for="loginPassword"><i class="fa-solid fa-lock me-2"></i>Password</label>
                <button type="button" class="btn btn-sm btn-link text-decoration-none password-toggle" aria-label="Toggle password visibility">
                  <i class="fa-solid fa-eye"></i>
                </button>
                <div class="invalid-feedback">Password must be 8-32 characters.</div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe" />
                  <label class="form-check-label text-muted" for="rememberMe">Remember Me</label>
                </div>
                <a href="#" class="text-primary small text-decoration-none">Forgot Password?</a>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg fw-semibold">Login</button>
              </div>

              <div id="loginAlert" class="alert d-none" role="alert"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoK18m1NQ5+31N6c3q3up0K8Y5QnN3G5p+E5oz9BS+ZgTnh" crossorigin="anonymous"></script>
  <script src="login.js"></script>
</body>
</html>
